openapi: 3.1.0
info:
  title: Agritainmen Platform API
  version: 1.0.0
  description: 四端统一 API。金额使用整数分。库存预占、订单创建、履约等接口按各自定义携带 Idempotency-Key；支付意图按订单 ID 幂等。
servers:
  - url: https://api.example.com/api/v1
paths:
  /org/suppliers/{id}/audit:
    post:
      summary: 审核供应商
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: { type: boolean, description: true 为通过，false 为驳回 }
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/suppliers/{id}/restore:
    post:
      summary: 恢复供应商待审核
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/suppliers/{id}/pause:
    post:
      summary: 暂停供应商
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: 返回暂停状态及 cooperationPauseReason；恢复合作时清除当前原因
  /org/suppliers/{id}/resume:
    post:
      summary: 恢复供应商合作
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/farm-accounts:
    get:
      summary: 查询门店账号列表
      responses:
        "200": { description: PLATFORM 管理员 farm.manage 权限可读取，不含密码 }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 新增门店账号
      responses:
        "200":
          description: OK
  /org/farm-accounts/{id}:
    get:
      summary: 查询门店账号绑定资料
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    put:
      summary: 修改门店账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: 启停门店账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/promoters:
    post:
      summary: 新增业务员
      responses:
        "200":
          description: OK
  /org/promoters/{id}:
    put:
      summary: 修改业务员
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/leaders/{id}:
    patch:
      summary: 启停团长
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/categories/{id}:
    put:
      summary: 修改品类
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      summary: 删除品类
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/prices/{id}:
    put:
      summary: 修改价格策略
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: 启停价格策略
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/products/{id}:
    patch:
      summary: 商品上下架
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/products/{id}/review:
    post:
      summary: 商品审核
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /auth/admin/roles:
    get:
      summary: 后台角色列表
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 新增后台角色
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/roles/{id}:
    put:
      summary: 修改后台角色
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/roles/{id}/permissions:
    put:
      summary: 修改角色权限
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/accounts:
    get:
      summary: 后台账号列表
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 新增后台账号
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/accounts/{id}:
    put:
      summary: 修改后台账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: 启停后台账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/supplier-accounts:
    get:
      summary: 已开通供应商账号列表（不含密码）
      responses:
        "200": { description: 返回 PLATFORM 租户账号列表 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 核验供应商审核状态后幂等开通账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierAccountProvisionRequest' }
      responses:
        "200": { description: 首次创建时返回一次 initialPassword；重试不重置密码 }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { description: 组织服务暂不可用或响应无效，未创建账号 }
  /auth/admin/store-accounts:
    get:
      summary: 查询已绑定的门店登录账号
      responses:
        "200": { description: 返回 Auth 绑定账号列表，不含密码 }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 核验组织服务门店账号后开通真实登录
      description: 需要 PLATFORM 管理员的 farm.manage 权限；重复请求不重置密码。组织服务停用账号后，登录、访问令牌校验和刷新均拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeAccountId, password]
              properties:
                storeAccountId: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { description: 返回绑定的门店账号及 farmId，不含密码 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { description: 组织服务暂不可用或响应无效，未创建账号 }
  /auth/admin/supplier-accounts/{supplierId}:
    get:
      summary: 按供应商 ID 查询登录账号
      parameters:
        - in: path
          name: supplierId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 返回账号资料及当前 freezeReason，不含密码 }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 修改供应商账号密码、名称或启用状态
      parameters:
        - in: path
          name: supplierId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierAccountPatch' }
      responses:
        "200": { description: 返回更新后的账号及当前 freezeReason；改密或停用撤销刷新会话 }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /catalog/categories:
    get:
      summary: 品类列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增品类
      responses:
        "200":
          description: OK
  /catalog/prices:
    get:
      summary: 价格策略列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增价格策略
      responses:
        "200":
          description: OK
    put:
      summary: 批量更新价格策略
      responses:
        "200":
          description: OK
  /org/users:
    get:
      summary: 用户分页查询
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /after-sales:
    get:
      summary: 售后工单分页查询
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /commissions/me:
    get:
      summary: 我的佣金汇总
      parameters:
        - in: query
          name: beneficiaryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/products:
    get:
      summary: 分页查询可售商品
      parameters:
        - in: query
          name: channel
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: 新增商品
      responses:
        "200":
          description: OK
  /org/suppliers:
    get:
      summary: 供应商列表（含完整资料 profile）
      responses:
        "200":
          description: OK
    post:
      summary: 邀请供应商
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSupplierProfile'
      responses:
        "200":
          description: 返回含 id、pending 状态及完整 profile 的供应商
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          description: 联系人手机号已绑定其他供应商
  /org/suppliers/{id}:
    get:
      summary: 按 ID 读取平台租户未删除的供应商及审核状态
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 返回完整供应商资料与 certified、status }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      summary: 修改供应商
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSupplierProfile'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回完整资料；审核状态保持不变
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          description: 供应商不存在
        "409":
          description: 联系人手机号已绑定其他供应商
  /org/farms:
    get:
      summary: 门店列表（含完整资料 profile）
      responses:
        "200":
          description: OK
    post:
      summary: 新增门店
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgFarmProfile'
      responses:
        "200":
          description: 返回含 id 及完整 profile 的门店
        "400":
          $ref: '#/components/responses/BadRequest'
  /org/farms/{id}:
    get:
      summary: 查询单个门店资料（管理员或 Auth 服务）
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回含 profile 的门店资料
    put:
      summary: 修改门店
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgFarmProfile'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回含完整 profile 的门店
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          description: 门店不存在
  /org/media:
    post:
      summary: 上传供应商资质或门店封面图片，资料中只保存返回的 assetId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgMediaUploadRequest' }
      responses:
        "200": { description: 返回稳定的 ORG-MEDIA assetId }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /org/media/{id}:
    get:
      summary: 按媒体 ID 读取图片，需对应资料域权限
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 图片二进制
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /org/me/supplier:
    get:
      summary: 查询当前供应商或司机所属的供应商资料
      responses:
        "200":
          description: 当前登录身份对应的供应商资料，含 version 与 profile.warehouse
        "401":
          $ref: "#/components/responses/Unauthorized"
  /org/me/supplier/warehouse:
    put:
      summary: 当前供应商修改自己的仓点资料
      description: 司机不得修改。仅替换当前供应商的 profile.warehouse，expectedVersion 不匹配返回 409；坐标系由服务端固定为 GCJ-02。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, expectedVersion]
              properties:
                address: { type: string, minLength: 1, maxLength: 500 }
                contactName: { type: string, maxLength: 100 }
                contactPhone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
                longitude: { type: number, minimum: -180, maximum: 180 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: 返回更新后的当前供应商完整资料及新 version
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: 资料版本已变化，须刷新后重试
  /org/drivers:
    get:
      summary: 司机列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增司机
      responses:
        "200":
          description: OK
  /org/drivers/{id}:
    put:
      summary: 修改司机
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: 启停司机
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /admin/dictionaries:
    get:
      summary: 字典列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增字典项
      responses:
        "200":
          description: OK
    put:
      summary: 修改字典项
      responses:
        "200":
          description: OK
    delete:
      summary: 删除字典项
      responses:
        "200":
          description: OK
  /admin/dashboard:
    get:
      summary: 运营看板聚合
      responses:
        "200":
          description: OK
  /admin/reports:
    get:
      summary: 经营报表分页
      parameters:
        - in: query
          name: from
          schema:
            type: string
        - in: query
          name: to
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /auth/admin/login:
    post:
      summary: 后台管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/wechat/exchange:
    post:
      summary: 微信 code 换服务端会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /catalog/skus/{skuId}/quote:
    get:
      summary: 服务端商品取价
      parameters:
        - in: path
          name: skuId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /inventory/available:
    get:
      summary: 批量查询 SKU 可用库存
      parameters:
        - in: query
          name: skuIds
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /inventory/reservations:
    post:
      summary: 库存预占
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /orders:
    get:
      summary: 分页查询订单
      parameters:
        - in: query
          name: buyerId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
    post:
      summary: 创建订单
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /payments/callback/wechat:
    post:
      summary: 沙箱支付回调
      description: 本地沙箱调用需携带 PAYMENT_CALLBACK_INTERNAL_TOKEN；微信 V3 验签尚未接入。
      parameters:
        - in: header
          name: X-Payment-Callback-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCallback"
      responses:
        "200":
          description: 返回 PAID、PAID_PENDING_ORDER、REFUND_REQUIRED 或 FAILED 的支付单
        "401":
          description: 回调令牌无效或校验失败
  /fulfillment/orders:
    post:
      summary: 创建履约单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - supplierId
              properties:
                orderId:
                  type: string
                supplierId:
                  type: string
      responses:
        "200":
          description: OK
    get:
      summary: 分页查询履约单
      parameters:
        - in: query
          name: supplierId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
  /fulfillment/orders/batch-accept:
    post:
      summary: 供应商批量接单
      description: 一批 1–100 个不同的履约单 ID，全部须属于当前供应商且处于 PENDING。任一单不符则整批不更新；成功返回 accepted 数量。成功后重复提交返回 409，须刷新列表核对。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, minLength: 1 }
      responses:
        "200":
          description: 返回 accepted 数量
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: 至少一单状态已变化，整批回滚
  /fulfillment/orders/{id}/accept:
    post:
      summary: 供应商接单
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /fulfillment/orders/{id}/assign-driver:
    post:
      summary: 供应商指派或更换本供应商的启用司机
      description: 仅已接单的履约单可指派。首次指派不传 expectedDriverId；更换时须传当前司机编号，状态或司机已变化返回 409。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driverId
              properties:
                driverId:
                  type: string
                expectedDriverId:
                  type: string
      responses:
        "200":
          description: 返回更新后的履约单
        "409":
          description: 订单状态或原司机已变化
  /fulfillment/orders/{id}/ship:
    post:
      summary: 快递/司机发货
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipType
              properties:
                shipType:
                  type: string
                  enum:
                    - courier
                    - driver
                trackingNo:
                  type: string
                driverId:
                  type: string
                  description: 司机配送时必须为已指派的司机编号
      responses:
        "200":
          description: OK
  /withdrawals/{id}/review:
    post:
      summary: 提现审批
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approved
                - operator
              properties:
                approved:
                  type: boolean
                operator:
                  type: string
                note:
                  type: string
      responses:
        "200":
          description: OK
  /auth/store/login:
    post:
      summary: 门店登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/store/farm:
    get:
      summary: 查询当前门店账号绑定的门店资料
      security:
        - bearerAuth: []
      responses:
        "200":
