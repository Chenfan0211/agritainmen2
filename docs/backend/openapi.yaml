        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: 新增佣金流水
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
  /withdrawals:
    post:
      summary: 发起提现
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
  /admin/audit:
    get:
      summary: 查询审计日志
      responses:
        "200":
          description: OK
    post:
      summary: 追加审计日志
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /notifications/sms/verification-code:
    post:
      summary: 发送沙箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: OK
  /notifications/sms/verify:
    post:
      summary: 校验沙箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: OK
  /org/leaders:
    get:
      summary: 团长列表
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventory/skus/{skuId}/available:
    get:
      summary: 查询 SKU 可用库存
      parameters:
        - in: path
          name: skuId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payments/orders/{orderId}:
    get:
      summary: 按订单查询支付单
      description: 仅当前买家可查询；PAID_PENDING_ORDER 表示支付到账但订单同步待重试，REFUND_REQUIRED 表示订单已取消且需退款处理。
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications/health:
    get:
      summary: 通知服务健康检查
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /catalog/pricing-defaults:
    put:
      summary: 更新价格默认档位
      responses:
        "200":
          description: OK
  /commissions/share-config:
    put:
      summary: 更新分佣配置
      responses:
        "200":
          description: OK
  /commissions/rules/{id}:
    put:
      summary: 更新佣金规则
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 当前账号无权访问资源
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 数据状态冲突或幂等键复用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SupplierAccountProvisionRequest:
      type: object
      required: [supplierId, account, displayName]
      properties:
        supplierId: { type: string }
        account: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        displayName: { type: string }
        password: { type: string, description: 可选；省略时生成一次性初始密码 }
    SupplierAccountPatch:
      type: object
      properties:
        displayName: { type: string }
        password: { type: string }
        enabled: { type: boolean }
        freezeReason: { type: string, minLength: 1, maxLength: 500, description: enabled=false 时必填；解冻时清除当前原因 }
    OrgMediaUploadRequest:
      type: object
      required: [mimeType, purpose, base64]
      properties:
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        purpose: { type: string, enum: [supplier-business-license, supplier-permit, farm-cover] }
        base64: { type: string, description: 图片原始字节的 base64，解码后不得超过 2MB }
    OrgSupplierProfile:
      type: object
      required: [name, contactPhone]
      properties:
        name: { type: string, minLength: 1 }
        contactPhone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        region: { type: string }
        category: { type: string }
        cooperationPauseReason: { type: string, readOnly: true, description: 当前暂停原因；恢复合作后为空 }
        profile:
          type: object
          properties:
            coop: { type: boolean }
            brands: { type: array, items: { type: string } }
            serviceRegions: { type: array, items: { type: string } }
            businessLicenseNumber: { type: string }
            businessLicense: { description: 新上传使用 ORG-MEDIA 引用；历史 URL、data URL 仍可读取 }
            permitNumber: { type: string }
            permit: { description: 新上传使用 ORG-MEDIA 引用；历史 URL、data URL 仍可读取 }
            validUntil: { type: string }
            reviewNote: { type: string }
    OrgFarmProfile:
      type: object
      required: [name, profile]
      properties:
        name: { type: string, minLength: 1 }
        region: { type: string }
        contact: { type: string }
        contactPhone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        status: { type: string, enum: [pending, active, paused] }
        profile:
          type: object
          required: [address]
          properties:
            city: { type: string }
            districtCode: { type: string }
            detail: { type: string }
            address: { type: string, minLength: 1 }
            structuredAddress: { type: object }
            tags: { type: array, items: { type: string } }
            rating: { type: number, minimum: 0, maximum: 5 }
            averageSpend: { type: number, minimum: 0, maximum: 1000000 }
            image: { description: 新上传使用 ORG-MEDIA 引用；历史 URL、data URL 仍可读取 }
            location: { type: object }
            locationStatus: { type: string, enum: [resolved, pending, failed] }
            locationError: { type: string }
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            tokenType:
              type: string
            expiresInSeconds:
              type: integer
              format: int64
    CatalogProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CatalogProduct:
      type: object
      properties:
        id:
          type: string
        supplierId:
          type: string
        name:
          type: string
        category:
          type: string
        channel:
          type: string
        enabled:
          type: boolean
        skus:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              priceCents:
                type: integer
                format: int64
              enabled:
                type: boolean
    Quote:
      type: object
      properties:
        skuId:
          type: string
        productId:
          type: string
        supplierId:
          type: string
        name:
          type: string
        unitPriceCents:
          type: integer
          format: int64
    ReserveRequest:
      type: object
      required:
        - orderId
        - items
      properties:
        orderId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - skuId
              - quantity
            properties:
              skuId:
                type: string
              quantity:
                type: integer
                minimum: 1
    Reservation:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum:
            - RESERVED
            - RELEASED
            - CONFIRMED
    CreateOrderRequest:
      type: object
      required:
        - buyerId
        - items
        - receiver
        - receiverPhone
        - address
      properties:
        buyerId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - skuId
              - quantity
            properties:
              skuId:
                type: string
              quantity:
                type: integer
                minimum: 1
        receiver:
          type: string
        receiverPhone:
          type: string
        address:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        orderNo:
          type: string
        status:
          type: string
        amountCents:
          type: integer
          format: int64
        reservationId:
          type: string
    PaymentCallback:
      type: object
      required:
        - provider
        - providerTxnId
        - orderId
        - success
      properties:
        provider:
          type: string
        providerTxnId:
          type: string
        orderId:
          type: string
        success:
          type: boolean
        failureReason:
          type: string
    CreatePaymentRequest:
      type: object
      required:
        - orderId
        - amountCents
        - channel
      properties:
        orderId:
          type: string
        amountCents:
          type: integer
          format: int64
        channel:
          type: string
          enum:
            - WECHAT
            - SANDBOX
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - traceId
        - timestamp
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
