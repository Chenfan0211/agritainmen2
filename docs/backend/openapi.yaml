  /auth/supplier/drivers:
    get:
      summary: 查询当前供应商的司机账号
      responses:
        "200":
          description: 仅返回所属供应商司机，不含密码
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 为当前供应商创建司机账号
      responses:
        "200":
          description: 已创建的司机账号，不含密码
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/supplier/drivers/{id}:
    patch:
      summary: 修改当前供应商的司机资料、密码或启用状态
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 修改后的司机账号，不含密码
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/refresh:
    post:
      summary: 刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - in: cookie
          name: agritainmen_admin_refresh
          required: false
          schema:
            type: string
          description: Admin 登录下发的刷新令牌 Cookie；与请求体 refreshToken 二选一
  /auth/me:
    get:
      summary: 当前登录主体
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: 退出登录并撤销刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventory/reservations/{id}/release:
    post:
      summary: 释放库存预占
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /inventory/reservations/{id}/confirm:
    post:
