openapi: 3.1.0
info:
  title: Agritainmen Platform API
  version: 1.0.0
  description: 四端统一 API。金额使用整数分。库存预占、订单创建、履约等接口按各自定义携带 Idempotency-Key；支付意图按订单 ID 幂等。商品与可用库存的 GET 可直接访问服务，商品非 GET 写入与库存调整须携带当前平台管理员 Bearer；库存预占、释放、确认仅供订单服务使用独立内部令牌，不能使用买家 Bearer 代替。
servers:
  - url: https://api.example.com/api/v1
paths:
  /org/suppliers/{id}/audit:
    post:
      summary: 审核供应商
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                approved: { type: boolean, description: true 为通过，false 为驳回 }
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/suppliers/{id}/restore:
    post:
      summary: 恢复供应商待审核
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/suppliers/{id}/pause:
    post:
      summary: 暂停供应商
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 500 }
      responses:
        "200":
          description: 返回暂停状态及 cooperationPauseReason；恢复合作时清除当前原因
  /org/suppliers/{id}/resume:
    post:
      summary: 恢复供应商合作
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/farm-accounts:
    get:
      summary: 查询门店账号列表
      responses:
        "200": { description: PLATFORM 管理员 farm.manage 权限可读取，不含密码 }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 新增门店账号
      responses:
        "200":
          description: OK
  /org/farm-accounts/{id}:
    get:
      summary: 查询门店账号绑定资料
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    put:
      summary: 修改门店账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: 启停门店账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/promoters:
    post:
      summary: 新增业务员
      responses:
        "200":
          description: OK
  /org/promoters/{id}:
    put:
      summary: 修改业务员
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /org/leaders/{id}:
    patch:
      summary: 启停团长
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/categories/{id}:
    put:
      summary: 修改品类
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    delete:
      summary: 删除品类
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/prices/{id}:
    put:
      summary: 修改价格策略
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: 启停价格策略
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/products/{id}:
    patch:
      summary: 商品上下架
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /catalog/products/{id}/review:
    post:
      summary: 商品审核
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /auth/admin/roles:
    get:
      summary: 后台角色列表
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 新增后台角色
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/roles/{id}:
    put:
      summary: 修改后台角色
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/roles/{id}/permissions:
    put:
      summary: 修改角色权限
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/accounts:
    get:
      summary: 后台账号列表
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 新增后台账号
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/accounts/{id}:
    put:
      summary: 修改后台账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
    patch:
      summary: 启停后台账号
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "403": { $ref: '#/components/responses/Forbidden' }
  /auth/admin/supplier-accounts:
    get:
      summary: 已开通供应商账号列表（不含密码）
      responses:
        "200": { description: 返回 PLATFORM 租户账号列表 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 核验供应商审核状态后幂等开通账号
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierAccountProvisionRequest' }
      responses:
        "200": { description: 首次创建时返回一次 initialPassword；重试不重置密码 }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { description: 组织服务暂不可用或响应无效，未创建账号 }
  /auth/admin/store-accounts:
    get:
      summary: 查询已绑定的门店登录账号
      responses:
        "200": { description: 返回 Auth 绑定账号列表，不含密码 }
        "403": { $ref: '#/components/responses/Forbidden' }
    post:
      summary: 核验组织服务门店账号后开通真实登录
      description: 需要 PLATFORM 管理员的 farm.manage 权限；重复请求不重置密码。组织服务停用账号后，登录、访问令牌校验和刷新均拒绝。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [storeAccountId, password]
              properties:
                storeAccountId: { type: string }
                password: { type: string, format: password }
      responses:
        "200": { description: 返回绑定的门店账号及 farmId，不含密码 }
        "401": { $ref: '#/components/responses/Unauthorized' }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
        "409": { $ref: '#/components/responses/Conflict' }
        "500": { description: 组织服务暂不可用或响应无效，未创建账号 }
  /auth/admin/supplier-accounts/{supplierId}:
    get:
      summary: 按供应商 ID 查询登录账号
      parameters:
        - in: path
          name: supplierId
          required: true
          schema: { type: string }
      responses:
        "200": { description: 返回账号资料及当前 freezeReason，不含密码 }
        "404": { $ref: '#/components/responses/NotFound' }
    patch:
      summary: 修改供应商账号密码、名称或启用状态
      parameters:
        - in: path
          name: supplierId
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupplierAccountPatch' }
      responses:
        "200": { description: 返回更新后的账号及当前 freezeReason；改密或停用撤销刷新会话 }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /catalog/categories:
    get:
      summary: 品类列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增品类
      description: 需要当前平台管理员 Bearer；Auth 会话失效后拒绝。
      responses:
        "200":
          description: OK
  /catalog/prices:
    get:
      summary: 价格策略列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增价格策略
      responses:
        "200":
          description: OK
    put:
      summary: 批量更新价格策略
      responses:
        "200":
          description: OK
  /org/users:
    get:
      summary: 用户分页查询
      parameters:
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /after-sales:
    get:
      summary: 平台管理员分页查询售后工单
      parameters:
        - in: query
          name: status
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
        "401":
          description: 未登录或令牌已失效
        "403":
          description: 非平台管理员
  /commissions/me:
    get:
      summary: 我的佣金汇总
      description: 当前有效团长只能查询其 Auth 身份绑定的 leaderId；具备 commission.manage 的平台管理员可查询指定团长。withdrawnCents 只统计佣金已提现状态；已审核但未付款的提现申请单列为 approvedWithdrawalCents，并继续占用可提现余额。earnedCents 为未冲正的佣金累计收入。
      parameters:
        - in: query
          name: beneficiaryId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      beneficiaryId: { type: string }
                      availableCents: { type: integer, format: int64 }
                      pendingCents: { type: integer, format: int64 }
                      withdrawnCents: { type: integer, format: int64 }
                      earnedCents: { type: integer, format: int64 }
                      approvedWithdrawalCents: { type: integer, format: int64 }
                    required: [beneficiaryId, availableCents, pendingCents, withdrawnCents, earnedCents, approvedWithdrawalCents]
  /commissions/me/records:
    get:
      summary: 我的佣金明细
      description: 当前有效团长只能查询本人佣金；具备 commission.manage 的平台管理员可代查。按创建时间和 ID 倒序；加载更多传入上一页末条记录的 beforeId，旧客户端不传游标时使用页码 offset。
      parameters:
        - in: query
          name: beneficiaryId
          required: true
          schema: { type: string }
        - in: query
          name: page
          schema: { type: integer, minimum: 1, default: 1 }
        - in: query
          name: pageSize
          schema: { type: integer, minimum: 1, maximum: 200, default: 10 }
        - in: query
          name: beforeId
          description: 本人佣金记录 ID；传入后从该记录之后读取，page 仅用于响应页码。
          schema: { type: string, minLength: 1, maxLength: 128 }
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items: { type: object }
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer, format: int64 }
                    required: [items, page, pageSize, total]
        "400":
          description: 分页参数或游标无效
        "401":
          description: 未登录或令牌已失效
        "403":
          description: 无权查询该团长佣金
  /catalog/products:
    get:
      summary: 分页查询可售商品
      description: store 和 live 渠道均包含 all 渠道商品；按商品分页，每个商品返回全部可售 SKU。
      parameters:
        - in: query
          name: channel
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: 新增商品
      responses:
        "200":
          description: OK
  /org/suppliers:
    get:
      summary: 供应商列表（含完整资料 profile）
      responses:
        "200":
          description: OK
    post:
      summary: 邀请供应商
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSupplierProfile'
      responses:
        "200":
          description: 返回含 id、pending 状态及完整 profile 的供应商
        "400":
          $ref: '#/components/responses/BadRequest'
        "409":
          description: 联系人手机号已绑定其他供应商
  /org/suppliers/{id}:
    get:
      summary: 按 ID 读取平台租户未删除的供应商及审核状态
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200": { description: 返回完整供应商资料与 certified、status }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
    put:
      summary: 修改供应商
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgSupplierProfile'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回完整资料；审核状态保持不变
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          description: 供应商不存在
        "409":
          description: 联系人手机号已绑定其他供应商
  /org/farms:
    get:
      summary: 门店列表（含完整资料 profile）
      responses:
        "200":
          description: OK
    post:
      summary: 新增门店
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgFarmProfile'
      responses:
        "200":
          description: 返回含 id 及完整 profile 的门店
        "400":
          $ref: '#/components/responses/BadRequest'
  /org/farms/{id}:
    get:
      summary: 查询单个门店资料（管理员或 Auth 服务）
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回含 profile 的门店资料
    put:
      summary: 修改门店
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OrgFarmProfile'
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回含完整 profile 的门店
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          description: 门店不存在
  /org/media:
    post:
      summary: 上传供应商资质或门店封面图片，资料中只保存返回的 assetId
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OrgMediaUploadRequest' }
      responses:
        "200": { description: 返回稳定的 ORG-MEDIA assetId }
        "400": { $ref: '#/components/responses/BadRequest' }
        "403": { $ref: '#/components/responses/Forbidden' }
  /org/media/{id}:
    get:
      summary: 按媒体 ID 读取图片，需对应资料域权限
      parameters:
        - in: path
          name: id
          required: true
          schema: { type: string }
      responses:
        "200":
          description: 图片二进制
          content:
            image/png: { schema: { type: string, format: binary } }
            image/jpeg: { schema: { type: string, format: binary } }
            image/webp: { schema: { type: string, format: binary } }
        "403": { $ref: '#/components/responses/Forbidden' }
        "404": { $ref: '#/components/responses/NotFound' }
  /org/me/supplier:
    get:
      summary: 查询当前供应商或司机所属的供应商资料
      responses:
        "200":
          description: 当前登录身份对应的供应商资料，含 version 与 profile.warehouse
        "401":
          $ref: "#/components/responses/Unauthorized"
  /org/me/supplier/warehouse:
    put:
      summary: 当前供应商修改自己的仓点资料
      description: 司机不得修改。仅替换当前供应商的 profile.warehouse，expectedVersion 不匹配返回 409；坐标系由服务端固定为 GCJ-02。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [address, expectedVersion]
              properties:
                address: { type: string, minLength: 1, maxLength: 500 }
                contactName: { type: string, maxLength: 100 }
                contactPhone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
                longitude: { type: number, minimum: -180, maximum: 180 }
                latitude: { type: number, minimum: -90, maximum: 90 }
                expectedVersion: { type: integer, minimum: 0 }
      responses:
        "200":
          description: 返回更新后的当前供应商完整资料及新 version
        "400":
          $ref: '#/components/responses/BadRequest'
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "409":
          description: 资料版本已变化，须刷新后重试
  /org/drivers:
    get:
      summary: 司机列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增司机
      responses:
        "200":
          description: OK
  /org/drivers/{id}:
    put:
      summary: 修改司机
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
    patch:
      summary: 启停司机
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /admin/dictionaries:
    get:
      summary: 字典列表
      responses:
        "200":
          description: OK
    post:
      summary: 新增字典项
      responses:
        "200":
          description: OK
    put:
      summary: 修改字典项
      responses:
        "200":
          description: OK
    delete:
      summary: 删除字典项
      responses:
        "200":
          description: OK
  /admin/dashboard:
    get:
      summary: 运营看板聚合
      responses:
        "200":
          description: OK
  /admin/reports:
    get:
      summary: 经营报表分页
      parameters:
        - in: query
          name: from
          schema:
            type: string
        - in: query
          name: to
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
  /auth/admin/login:
    post:
      summary: 后台管理员登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/wechat/exchange:
    post:
      summary: 微信 code 换服务端会话
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - code
              properties:
                code:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /catalog/skus/{skuId}/quote:
    get:
      summary: 服务端商品取价
      parameters:
        - in: path
          name: skuId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Quote"
  /inventory/available:
    get:
      summary: 批量查询 SKU 可用库存
      parameters:
        - in: query
          name: skuIds
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /inventory/reservations:
    post:
      summary: 库存预占
      description: 仅订单服务调用，需与库存服务配置一致的内部令牌。
      parameters:
        - in: header
          name: X-Inventory-Internal-Token
          required: true
          schema:
            type: string
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ReserveRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Reservation"
  /orders:
    get:
      summary: 分页查询订单
      description: 买家订单列表不包含内部创建中和明确库存不足的订单。
      parameters:
        - in: query
          name: buyerId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
    post:
      summary: 创建订单
      description: 先持久化订单创建记录，再预占库存。库存或订单库暂不可用时可使用原幂等键重试，服务端也会分批重试；明确库存不足返回 409 OUT_OF_STOCK，补货后需使用新幂等键重新下单。
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateOrderRequest"
      responses:
        "200":
          description: 库存已预占，返回 PENDING_PAYMENT 订单
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
        "409":
          description: 库存不足或幂等键与原请求冲突
  /payments/callback/wechat:
    post:
      summary: 沙箱支付回调
      description: 本地沙箱调用需携带 PAYMENT_CALLBACK_INTERNAL_TOKEN；微信 V3 验签尚未接入。
      parameters:
        - in: header
          name: X-Payment-Callback-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PaymentCallback"
      responses:
        "200":
          description: 返回 PAID、PAID_PENDING_ORDER、REFUND_REQUIRED、REFUNDED 或 FAILED 的支付单；REFUNDED 仅由已确认成功的沙箱退款产生
        "401":
          description: 回调令牌无效或校验失败
  /fulfillment/orders:
    post:
      summary: 创建履约单
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - orderId
                - supplierId
              properties:
                orderId:
                  type: string
                supplierId:
                  type: string
      responses:
        "200":
          description: OK
    get:
      summary: 分页查询履约单
      parameters:
        - in: query
          name: supplierId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: OK
  /fulfillment/orders/batch-accept:
    post:
      summary: 供应商批量接单
      description: 一批 1–100 个不同的履约单 ID，全部须属于当前供应商且处于 PENDING。任一单不符则整批不更新；成功返回 accepted 数量。成功后重复提交返回 409，须刷新列表核对。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  uniqueItems: true
                  items: { type: string, minLength: 1 }
      responses:
        "200":
          description: 返回 accepted 数量
        "400":
          $ref: '#/components/responses/BadRequest'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: 至少一单状态已变化，整批回滚
  /fulfillment/orders/{id}/accept:
    post:
      summary: 供应商接单
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /fulfillment/orders/{id}/assign-driver:
    post:
      summary: 供应商指派或更换本供应商的启用司机
      description: 仅已接单的履约单可指派。首次指派不传 expectedDriverId；更换时须传当前司机编号，状态或司机已变化返回 409。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - driverId
              properties:
                driverId:
                  type: string
                expectedDriverId:
                  type: string
      responses:
        "200":
          description: 返回更新后的履约单
        "409":
          description: 订单状态或原司机已变化
  /fulfillment/orders/{id}/ship:
    post:
      summary: 快递/司机发货
      parameters:
        - in: header
          name: Idempotency-Key
          required: true
          schema:
            type: string
          description: 幂等键：同键同载荷重放返回原结果；同键异载荷返回 409 IDEMPOTENCY_CONFLICT
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - shipType
              properties:
                shipType:
                  type: string
                  enum:
                    - courier
                    - driver
                trackingNo:
                  type: string
                driverId:
                  type: string
                  description: 司机配送时必须为已指派的司机编号
      responses:
        "200":
          description: OK
  /fulfillment/orders/{id}/delivered:
    post:
      summary: 供应商确认快递签收
      description: 仅本供应商的 SHIPPED 快递单可转为 RECEIVED；重复确认或司机配送单返回 409。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回更新后的履约单
        "401":
          $ref: '#/components/responses/Unauthorized'
        "403":
          $ref: '#/components/responses/Forbidden'
        "404":
          $ref: '#/components/responses/NotFound'
        "409":
          description: 履约状态或配送方式不允许确认
  /withdrawals/{id}/review:
    post:
      summary: 提现审批
      description: 需要当前平台管理员的 withdrawal.review 或 leader.withdrawal.review 权限；审核人由服务端身份确定。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - approved
              properties:
                approved:
                  type: boolean
                operator:
                  type: string
                  deprecated: true
                  description: 兼容旧客户端；服务端忽略此值，使用当前管理员 ID
                note:
                  type: string
      responses:
        "200":
          description: OK
  /auth/store/login:
    post:
      summary: 门店登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/store/farm:
    get:
      summary: 查询当前门店账号绑定的门店资料
      security:
        - bearerAuth: []
      responses:
        "200":
          description: 返回门店名称、联系人、电话、地址及业务员价格档位
  /auth/supplier/login:
    post:
      summary: 供应商登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
  /auth/driver/login:
    post:
      summary: 司机登录
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: 返回绑定的 supplierId 与 driverId
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/supplier/drivers:
    get:
      summary: 查询当前供应商的司机账号
      responses:
        "200":
          description: 仅返回所属供应商司机，不含密码
        "401":
          $ref: "#/components/responses/Unauthorized"
    post:
      summary: 为当前供应商创建司机账号
      responses:
        "200":
          description: 已创建的司机账号，不含密码
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/supplier/drivers/{id}:
    patch:
      summary: 修改当前供应商的司机资料、密码或启用状态
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 修改后的司机账号，不含密码
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /auth/refresh:
    post:
      summary: 刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "409":
          $ref: "#/components/responses/Conflict"
      parameters:
        - in: cookie
          name: agritainmen_admin_refresh
          required: false
          schema:
            type: string
          description: Admin 登录下发的刷新令牌 Cookie；与请求体 refreshToken 二选一
  /auth/me:
    get:
      summary: 当前登录主体
      description: 返回当前有效会话。用户包含实时等级与团长 leaderId；管理员权限按当前有效角色计算。
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /auth/logout:
    post:
      summary: 退出登录并撤销刷新令牌
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - refreshToken
              properties:
                refreshToken:
                  type: string
      responses:
        "200":
          description: OK
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventory/reservations/{id}/release:
    post:
      summary: 释放库存预占
      description: 仅订单服务调用，需与库存服务配置一致的内部令牌。
      parameters:
        - in: header
          name: X-Inventory-Internal-Token
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /inventory/reservations/{id}/confirm:
    post:
      summary: 确认库存扣减
      description: 仅订单服务调用，需与库存服务配置一致的内部令牌。
      parameters:
        - in: header
          name: X-Inventory-Internal-Token
          required: true
          schema:
            type: string
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /inventory/skus/{skuId}/adjust:
    post:
      summary: 调整库存
      description: 需要当前平台管理员 Bearer；Auth 会话失效后拒绝。
      parameters:
        - in: path
          name: skuId
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - delta
                - reason
              properties:
                delta:
                  type: integer
                reason:
                  type: string
      responses:
        "200":
          description: OK
  /orders/{id}:
    get:
      summary: 订单详情
      description: 内部创建中与明确库存不足的订单对买家返回 404。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}/cancel:
    post:
      summary: 取消待付款订单并释放库存预占
      description: 仅当前买家可操作；先提交未支付取消，再释放库存预占。库存服务暂不可用时仍返回已取消订单，由服务端重试释放；重复取消可触发重试。支付确认中、已付款等状态返回 409。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回状态为 UNPAID_CANCELLED 的订单；库存释放可能仍在后台重试
        "401":
          description: 未登录或令牌失效
        "404":
          description: 订单不存在或不属于当前买家
        "409":
          description: 订单状态不允许取消
  /orders/{id}/payment-confirmation:
    post:
      summary: 内部确认订单支付并确认库存预占
      description: 仅支付服务使用；先持久化确认中标记，再调用库存确认，最后提交 PAID。确认中不可取消；库存或订单库暂不可用时由服务端重试。取消先赢则返回 UNPAID_CANCELLED，供支付服务登记待退款。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Order-Payment-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents]
              properties:
                amountCents: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 返回 PAID 或 UNPAID_CANCELLED 的订单
        "401":
          description: 内部令牌无效
        "409":
          description: 金额不符、订单状态不允许确认或库存预占未确认
  /payments/intents:
    post:
      summary: 创建支付单
      description: 使用买家 Bearer 读取订单并核对归属、待付款状态和金额；同一订单重复创建返回原支付意图。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "200":
          description: OK
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: 当前买家的 Bearer access token
  /fulfillment/logistics/{trackingNo}:
    get:
      summary: 查询沙箱物流轨迹
      parameters:
        - in: path
          name: trackingNo
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
  /commissions:
    get:
      summary: 佣金分页查询
      description: 需要当前平台管理员的 commission.manage 权限。
      parameters:
        - in: query
          name: beneficiaryId
          schema:
            type: string
        - in: query
          name: page
          schema:
            type: integer
        - in: query
          name: pageSize
          schema:
            type: integer
      responses:
        "200":
          description: OK
    post:
      summary: 新增佣金流水
      description: 需要当前平台管理员的 commission.manage 权限。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /withdrawals:
    get:
      summary: 管理员查询提现申请
      description: 仅具备 withdrawal.review 或 leader.withdrawal.review 权限的平台管理员可查询；平台租户内按创建时间、ID 倒序分页。pendingTotal 为全局待审核数，不受筛选和分页影响。
      parameters:
        - name: requesterId
          in: query
          required: false
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 20
        - name: status
          in: query
          schema:
            type: string
            enum: [PENDING, APPROVED, REJECTED]
        - name: keyword
          in: query
          description: 按提现单号、申请人编号或提现方式查找，最多 100 字符。
          schema:
            type: string
            maxLength: 100
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer, format: int64 }
                      pendingTotal: { type: integer, format: int64 }
                    required: [items, page, pageSize, total, pendingTotal]
        "400":
          description: 分页、状态或关键词参数不合法
        "401":
          description: 未登录
        "403":
          description: 无审核权限
    post:
      summary: 发起提现
      description: 当前有效团长只能为 Auth 身份绑定的 leaderId 提现；具备 commission.manage 的平台管理员可代提交。同一申请人用同一幂等键和相同金额、方式重试时返回原申请；参数不同返回 409。
      parameters:
        - name: Idempotency-Key
          in: header
          required: true
          description: 同一申请人每次新提现申请使用新键，最多 128 字符。
          schema:
            type: string
            maxLength: 128
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
        "400":
          description: 缺少或无效的幂等键
        "409":
          description: 幂等键对应的申请参数不同
  /withdrawals/me:
    get:
      summary: 查询我的提现申请
      description: 当前有效团长只能查询 Auth 身份绑定的 leaderId；具备 commission.manage 的平台管理员可代查。按创建时间、ID 倒序分页；加载更多时传入上一页末条记录的 beforeId，服务端按创建时间和 ID 续查，不受新申请插入影响。不传 beforeId 时沿用页码 offset。total 为实时总数，客户端可保留首次查询总数作为当前加载轮次上限；pendingTotal 实时统计该申请人的待审申请，不受分页影响。
      parameters:
        - name: requesterId
          in: query
          required: true
          schema:
            type: string
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 200
            default: 10
        - name: beforeId
          in: query
          description: 可选的本人提现申请 ID；传入后从该记录之后继续读取，page 仅作为响应页码。
          schema:
            type: string
            minLength: 1
            maxLength: 128
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: object
                    properties:
                      items:
                        type: array
                        items:
                          type: object
                      page: { type: integer }
                      pageSize: { type: integer }
                      total: { type: integer, format: int64 }
                      pendingTotal: { type: integer, format: int64 }
                    required: [items, page, pageSize, total, pendingTotal]
        "400":
          description: 分页参数或 beforeId 不合法，或游标不属于当前申请人
  /admin/audit:
    get:
      summary: 查询审计日志
      responses:
        "200":
          description: OK
    post:
      summary: 追加审计日志
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
      responses:
        "200":
          description: OK
  /notifications/sms/verification-code:
    post:
      summary: 发送沙箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
              properties:
                phone:
                  type: string
      responses:
        "200":
          description: OK
  /notifications/sms/verify:
    post:
      summary: 校验沙箱验证码
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - phone
                - code
              properties:
                phone:
                  type: string
                code:
                  type: string
      responses:
        "200":
          description: OK
  /org/leaders:
    get:
      summary: 团长列表
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /inventory/skus/{skuId}/available:
    get:
      summary: 查询 SKU 可用库存
      parameters:
        - in: path
          name: skuId
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /payments/orders/{orderId}:
    get:
      summary: 按订单查询支付单
      description: 仅当前买家可查询；PAID_PENDING_ORDER 表示支付到账但订单同步待重试，REFUND_REQUIRED 表示取消后到账且退款待重试，REFUNDED 表示沙箱渠道已确认全额退款。真实微信 V3 退款尚未接入。
      parameters:
        - in: path
          name: orderId
          required: true
          schema:
            type: string
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
        "404":
          $ref: "#/components/responses/NotFound"
  /notifications/health:
    get:
      summary: 通知服务健康检查
      responses:
        "200":
          description: OK
        "401":
          $ref: "#/components/responses/Unauthorized"
  /catalog/pricing-defaults:
    put:
      summary: 更新价格默认档位
      description: 需要当前平台管理员 Bearer；Auth 会话失效后拒绝。
      responses:
        "200":
          description: OK
  /commissions/share-config:
    put:
      summary: 更新分佣配置
      description: 需要当前平台管理员的 commission.manage 或 leader.manage 权限。
      responses:
        "200":
          description: OK
  /commissions/rules/{id}:
    put:
      summary: 更新佣金规则
      description: 需要当前平台管理员的 commission.manage 权限。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
components:
  responses:
    BadRequest:
      description: 请求参数错误
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Unauthorized:
      description: 未登录或登录已失效
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Forbidden:
      description: 当前账号无权访问资源
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    NotFound:
      description: 资源不存在
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
    Conflict:
      description: 数据状态冲突或幂等键复用
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorEnvelope"
  schemas:
    SupplierAccountProvisionRequest:
      type: object
      required: [supplierId, account, displayName]
      properties:
        supplierId: { type: string }
        account: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        displayName: { type: string }
        password: { type: string, description: 可选；省略时生成一次性初始密码 }
    SupplierAccountPatch:
      type: object
      properties:
        displayName: { type: string }
        password: { type: string }
        enabled: { type: boolean }
        freezeReason: { type: string, minLength: 1, maxLength: 500, description: enabled=false 时必填；解冻时清除当前原因 }
    OrgMediaUploadRequest:
      type: object
      required: [mimeType, purpose, base64]
      properties:
        mimeType: { type: string, enum: [image/jpeg, image/png, image/webp] }
        purpose: { type: string, enum: [supplier-business-license, supplier-permit, farm-cover] }
        base64: { type: string, description: 图片原始字节的 base64，解码后不得超过 2MB }
    OrgSupplierProfile:
      type: object
      required: [name, contactPhone]
      properties:
        name: { type: string, minLength: 1 }
        contactPhone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        region: { type: string }
        category: { type: string }
        cooperationPauseReason: { type: string, readOnly: true, description: 当前暂停原因；恢复合作后为空 }
        profile:
          type: object
          properties:
            coop: { type: boolean }
            brands: { type: array, items: { type: string } }
            serviceRegions: { type: array, items: { type: string } }
            businessLicenseNumber: { type: string }
            businessLicense: { description: 新上传使用 ORG-MEDIA 引用；历史 URL、data URL 仍可读取 }
            permitNumber: { type: string }
            permit: { description: 新上传使用 ORG-MEDIA 引用；历史 URL、data URL 仍可读取 }
            validUntil: { type: string }
            reviewNote: { type: string }
    OrgFarmProfile:
      type: object
      required: [name, profile]
      properties:
        name: { type: string, minLength: 1 }
        region: { type: string }
        contact: { type: string }
        contactPhone: { type: string, pattern: '^1[3-9][0-9]{9}$' }
        status: { type: string, enum: [pending, active, paused] }
        profile:
          type: object
          required: [address]
          properties:
            city: { type: string }
            districtCode: { type: string }
            detail: { type: string }
            address: { type: string, minLength: 1 }
            structuredAddress: { type: object }
            tags: { type: array, items: { type: string } }
            rating: { type: number, minimum: 0, maximum: 5 }
            averageSpend: { type: number, minimum: 0, maximum: 1000000 }
            image: { description: 新上传使用 ORG-MEDIA 引用；历史 URL、data URL 仍可读取 }
            location: { type: object }
            locationStatus: { type: string, enum: [resolved, pending, failed] }
            locationError: { type: string }
    LoginRequest:
      type: object
      required:
        - account
        - password
      properties:
        account:
          type: string
        password:
          type: string
          format: password
    TokenResponse:
      type: object
      properties:
        code:
          type: string
        message:
          type: string
        data:
          type: object
          properties:
            accessToken:
              type: string
            refreshToken:
              type: string
            tokenType:
              type: string
            expiresInSeconds:
              type: integer
              format: int64
    CatalogProductPage:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/CatalogProduct"
        page:
          type: integer
        pageSize:
          type: integer
        total:
          type: integer
    CatalogProduct:
      type: object
      properties:
        id:
          type: string
        supplierId:
          type: string
        name:
          type: string
        category:
          type: string
        channel:
          type: string
        enabled:
          type: boolean
        skus:
          type: array
          items:
            type: object
            properties:
              id:
                type: string
              name:
                type: string
              priceCents:
                type: integer
                format: int64
              enabled:
                type: boolean
    Quote:
      type: object
      properties:
        skuId:
          type: string
        productId:
          type: string
        supplierId:
          type: string
        name:
          type: string
        unitPriceCents:
          type: integer
          format: int64
    ReserveRequest:
      type: object
      required:
        - orderId
        - items
      properties:
        orderId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - skuId
              - quantity
            properties:
              skuId:
                type: string
              quantity:
                type: integer
                minimum: 1
    Reservation:
      type: object
      properties:
        id:
          type: string
        orderId:
          type: string
        status:
          type: string
          enum:
            - RESERVED
            - RELEASED
            - CONFIRMED
    CreateOrderRequest:
      type: object
      required:
        - buyerId
        - items
        - receiver
        - receiverPhone
        - address
      properties:
        buyerId:
          type: string
        items:
          type: array
          items:
            type: object
            required:
              - skuId
              - quantity
            properties:
              skuId:
                type: string
              quantity:
                type: integer
                minimum: 1
        receiver:
          type: string
        receiverPhone:
          type: string
        address:
          type: string
    Order:
      type: object
      properties:
        id:
          type: string
        orderNo:
          type: string
        status:
          type: string
        amountCents:
          type: integer
          format: int64
        reservationId:
          type: string
    PaymentCallback:
      type: object
      required:
        - provider
        - providerTxnId
        - orderId
        - success
      properties:
        provider:
          type: string
        providerTxnId:
          type: string
        orderId:
          type: string
        success:
          type: boolean
        failureReason:
          type: string
    CreatePaymentRequest:
      type: object
      required:
        - orderId
        - amountCents
        - channel
      properties:
        orderId:
          type: string
        amountCents:
          type: integer
          format: int64
        channel:
          type: string
          enum:
            - WECHAT
            - SANDBOX
    ErrorEnvelope:
      type: object
      required:
        - code
        - message
        - data
        - traceId
        - timestamp
      properties:
        code:
          type: string
          example: BAD_REQUEST
        message:
          type: string
        data:
          nullable: true
        traceId:
          type: string
        timestamp:
          type: string
          format: date-time
