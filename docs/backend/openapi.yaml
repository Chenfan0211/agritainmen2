                  type: string
      responses:
        "200":
          description: OK
  /orders/{id}:
    get:
      summary: 订单详情
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Order"
  /orders/{id}/cancel:
    post:
      summary: 取消待付款订单并释放库存预占
      description: 仅当前买家可操作；先提交未支付取消，再释放库存预占。库存服务暂不可用时仍返回已取消订单，由服务端重试释放；重复取消可触发重试。已付款等其他状态返回 409。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
      responses:
        "200":
          description: 返回状态为 UNPAID_CANCELLED 的订单；库存释放可能仍在后台重试
        "401":
          description: 未登录或令牌失效
        "404":
          description: 订单不存在或不属于当前买家
        "409":
          description: 订单状态不允许取消
  /orders/{id}/payment-confirmation:
    post:
      summary: 内部确认订单支付并确认库存预占
      description: 仅支付服务使用；与待付款取消共用订单行锁。已取消订单返回 UNPAID_CANCELLED，供支付服务登记待退款。
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: string
        - in: header
          name: X-Order-Payment-Token
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [amountCents]
              properties:
                amountCents: { type: integer, format: int64, minimum: 1 }
      responses:
        "200":
          description: 返回 PAID 或 UNPAID_CANCELLED 的订单
        "401":
          description: 内部令牌无效
        "409":
          description: 金额不符或库存预占未确认
  /payments/intents:
    post:
      summary: 创建支付单
      description: 使用买家 Bearer 读取订单并核对归属、待付款状态和金额；同一订单重复创建返回原支付意图。
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreatePaymentRequest"
      responses:
        "200":
          description: OK
      parameters:
        - in: header
          name: Authorization
          required: true
          schema:
            type: string
          description: 当前买家的 Bearer access token
  /fulfillment/logistics/{trackingNo}:
    get:
