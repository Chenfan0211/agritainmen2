server:
  port: 8081
spring:
  application:
  mvc:
    throw-exception-if-no-handler: true
    name: auth-service
  cloud:
    nacos:
      discovery:
        enabled: ${NACOS_DISCOVERY_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:agritainmen-staging}
        group: ${NACOS_GROUP:AGRITAINMEN_STAGING}
      config:
        enabled: ${NACOS_CONFIG_ENABLED:false}
        server-addr: ${NACOS_SERVER_ADDR:127.0.0.1:8848}
        namespace: ${NACOS_NAMESPACE:agritainmen-staging}
        group: ${NACOS_GROUP:AGRITAINMEN_STAGING}
  datasource:
    url: ${DB_URL:jdbc:mysql://127.0.0.1:3306/agritainmen_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai}
    username: ${DB_USERNAME:agritainmen}
    password: ${DB_PASSWORD:change-me}
  flyway:
    enabled: true
    locations: classpath:db/migration
  rabbitmq:
    host: ${RABBITMQ_HOST:127.0.0.1}
    port: ${RABBITMQ_PORT:5672}
    username: ${RABBITMQ_USERNAME:agritainmen}
    password: ${RABBITMQ_PASSWORD:change-me}
  config:
    import: optional:nacos:${spring.application.name}.yml?group=${NACOS_GROUP:AGRITAINMEN_STAGING}
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus
  endpoint:
    health:
      probes:
        enabled: true
agritainmen:
  clients:
    org:
      base-url: ${ORG_SERVICE_BASE_URL:http://127.0.0.1:8082}
  security:
    jwt:
      secret: ${JWT_SECRET:change-me-at-least-32-bytes-long-secret}
      issuer: agritainmen
  demo:
    seed-enabled: ${AGRITAINMEN_DEMO_SEED_ENABLED:false}
  wechat:
    mode: ${AGRITAINMEN_WECHAT_MODE:demo}
    apps:
      store:
        app-id: ${WECHAT_APP_ID_STORE:}
        app-secret: ${WECHAT_APP_SECRET_STORE:}
      user:
        app-id: ${WECHAT_APP_ID_USER:}
        app-secret: ${WECHAT_APP_SECRET_USER:}
      supplier:
        app-id: ${WECHAT_APP_ID_SUPPLIER:}
        app-secret: ${WECHAT_APP_SECRET_SUPPLIER:}
