server:
  port: 0

spring:
  application:
  mvc:
    throw-exception-if-no-handler: true
    name: auth-service
  cloud:
    nacos:
      discovery:
        enabled: false
      config:
        enabled: false
  datasource:
    url: jdbc:h2:mem:auth_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
  main:
    allow-bean-definition-overriding: true

agritainmen:
  demo:
    seed-enabled: true
  wechat:
    mode: demo
  security:
    jwt:
      secret: integration-test-secret-integration-test-secret-1234
      issuer: agritainmen-test
