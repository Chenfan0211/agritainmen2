server: { port: 0 }
spring:
  application: { name: notification-service }
  mvc:
    throw-exception-if-no-handler: true
  security:
    user:
      name: api-audit
      password: api-audit-password
  cloud:
    nacos:
      discovery: { enabled: false }
      config: { enabled: false }
  datasource:
    url: jdbc:h2:mem:notification_test;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
    driver-class-name: org.h2.Driver
  flyway:
    enabled: true
    locations: classpath:db/migration
