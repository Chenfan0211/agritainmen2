      API_DOMAIN: ${API_DOMAIN:-api-staging.example.com}
      ADMIN_DOMAIN: ${ADMIN_DOMAIN:-admin-staging.example.com}
      ACME_EMAIL: ${ACME_EMAIL:-ops@example.com}
    ports:
    - 80:80
    - 443:443
    volumes:
    - ./Caddyfile:/etc/caddy/Caddyfile:ro
    - ../../apps/admin/dist/build/h5:/srv/admin:ro
    - caddy-data:/data
    - caddy-config:/config
    depends_on:
      api-gateway:
        condition: service_healthy
