global:
  scrape_interval: 15s
scrape_configs:
  - job_name: agritainmen-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway:8080
          - auth-service:8080
          - org-service:8080
          - catalog-service:8080
          - inventory-service:8080
          - order-service:8080
          - payment-service:8080
          - fulfillment-service:8080
          - settlement-service:8080
          - platform-admin-service:8080
          - notification-service:8080
